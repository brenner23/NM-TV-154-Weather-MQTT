; ============================================================================
;  NM-TV-154  "WeatherTV"  —  PlatformIO Projekt
;  ESP32 (WROOM)  +  ST7789 240x240  +  Touch  +  MQTT (Mode 3)
; ----------------------------------------------------------------------------
;    pio run -e usb -t upload      -> per USB-Kabel flashen
;    pio run -e ota -t upload      -> per WLAN (OTA) flashen
; ============================================================================

[env]
; Offizielles Paket liefert inzwischen Arduino-Core 3.x (pin-basierte LEDC-API).
; Falls du bei pioarduino bist, nur diese Zeile tauschen gegen:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip

framework     = arduino
board         = esp32dev
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library @ 1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library @ 1.11.0
    adafruit/Adafruit BusIO @ 1.17.4
    bblanchon/ArduinoJson @ 7.4.3
    mlesniew/PicoMQTT @ 1.3.0          ; MQTT-Broker auf dem ESP32 (Mode 3)

board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0

default_envs = usb

[env:usb]
upload_speed = 921600

[env:ota]
upload_protocol = espota
upload_port     = 192.168.0.45          ; <-- IP des Displays hier eintragen!
upload_flags    =
    --port=3232
    --auth=dasdaDadaDAsdsadaDASdd
